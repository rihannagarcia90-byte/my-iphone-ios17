<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My iPhone</title>
<style>
:root{--ink:#202027;--muted:#85838b;--blue:#087df0;--paper:#f7f7fa}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:#e9e5eb;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--ink)}
.phone{width:min(390px,100vw);height:min(844px,100dvh);min-height:620px;position:relative;overflow:hidden;border:8px solid #242329;border-radius:48px;background:#d9b4d0;box-shadow:0 22px 65px #0003}
.wallpaper{position:absolute;inset:0;background:linear-gradient(145deg,#f8d8e7,#dca9cc,#bba7d8) center/cover}
.status{position:absolute;z-index:10;top:0;left:0;width:100%;height:42px;padding:11px 22px;display:flex;justify-content:space-between;color:white;font-size:13px;font-weight:650;pointer-events:none;text-shadow:0 1px 4px #0004}
.island{position:absolute;z-index:11;top:8px;left:50%;transform:translateX(-50%);width:105px;height:29px;border-radius:30px;background:#050505}
.screen{position:absolute;inset:0;display:none;z-index:2;color:white}
.screen.active{display:block}
.lock{text-align:center;padding:100px 18px 0;text-shadow:0 1px 5px #0003}
.lock-date{font-size:17px}.lock-clock{font-size:76px;font-weight:300;letter-spacing:-4px}
.lock-message{margin-top:30px;font-size:14px}
.dots{display:flex;justify-content:center;gap:13px;margin:20px 0}
.dot{width:10px;height:10px;border:1px solid white;border-radius:50%}.dot.filled{background:white}
.keypad{display:grid;grid-template-columns:repeat(3,64px);justify-content:center;gap:12px;margin-top:18px}
.key{height:64px;border-radius:50%;border:1px solid #ffffff66;background:#ffffff25;color:white;font-size:25px;backdrop-filter:blur(8px);cursor:pointer}
.key:active{background:#ffffff70}
.lock-hint{font-size:11px;margin-top:12px;opacity:.8}
.home{padding:64px 18px 110px}
.home-clock{text-align:center;font-size:40px;font-weight:300;margin:12px 0 27px;text-shadow:0 1px 5px #0003}
.app-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:22px 8px}
.app{min-width:0;text-align:center;color:white;font-size:11px;text-shadow:0 1px 4px #0006;cursor:pointer}
.app-icon{width:58px;height:58px;margin:0 auto 6px;border-radius:15px;overflow:hidden;background:#fff;box-shadow:0 3px 9px #0002}
.app-icon img{width:100%;height:100%;display:block;object-fit:cover}
.dock{position:absolute;bottom:17px;left:12px;right:12px;height:78px;border-radius:25px;background:#ffffff55;backdrop-filter:blur(20px);display:flex;justify-content:space-evenly;align-items:center}
.dock .app-icon{margin:0}
.home-indicator{position:absolute;bottom:6px;left:50%;transform:translateX(-50%);height:4px;width:105px;background:white;border-radius:10px;z-index:20}
.app-screen{position:absolute;inset:0;z-index:5;display:none;padding-top:44px;overflow-y:auto;background:var(--paper);color:var(--ink)}
.app-screen.open{display:block}
.app-header{height:55px;padding:0 17px;display:grid;grid-template-columns:1fr 2fr 1fr;align-items:center;border-bottom:1px solid #e8e8ec;background:#fbfbfd;position:sticky;top:0;z-index:4}
.app-header h2{font-size:19px;text-align:center;margin:0;font-weight:650}
.back{border:0;background:none;color:var(--blue);font-size:15px;text-align:left;padding:8px 0;cursor:pointer}
.content{padding:16px 17px 35px}
.section-title{font-size:26px;font-weight:750;letter-spacing:-.7px;margin:3px 0 16px}
.subtle{color:var(--muted);font-size:13px}
.card{background:white;border:1px solid #ececf0;border-radius:15px;padding:13px;margin:9px 0}
.row{display:flex;align-items:center;gap:12px}
.avatar{width:42px;height:42px;border-radius:50%;object-fit:cover;background:#e9e9ef;display:grid;place-items:center;font-weight:700;color:#777;flex:none}
.list-row{padding:13px 2px;border-bottom:1px solid #e9e9ed}
.list-row strong{display:block;font-size:14px}.list-row small{color:var(--muted);font-size:12px}
.bubble{max-width:82%;padding:10px 13px;border-radius:17px;margin:9px 0;font-size:14px;line-height:1.35;background:#e9e9ed}
.bubble.me{margin-left:auto;background:#1685f8;color:white}
.photo-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:3px}
.photo-grid img{width:100%;aspect-ratio:1;object-fit:cover;background:#e5e5e9}
.note-card{background:#fff7c9;border-radius:12px;padding:13px;margin:8px 0;min-height:85px}
.note-card strong{display:block;margin-bottom:7px}
.month-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;text-align:center;font-size:12px}
.month-grid span{padding:8px 0;border-radius:9px;background:white}
.month-grid .today{background:#1685f8;color:white}
.action{background:var(--blue);border:0;border-radius:11px;padding:10px 14px;color:white;font-size:13px;cursor:pointer}
.pill{display:inline-block;background:#efeff4;padding:6px 10px;border-radius:20px;font-size:11px;color:#555}
.music-cover{width:58px;height:58px;border-radius:10px;object-fit:cover;background:linear-gradient(135deg,#f6c8df,#a7a1dc);display:grid;place-items:center;font-size:22px;flex:none}
.insta-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:2px}
.insta-grid img{width:100%;aspect-ratio:1;object-fit:cover}
.profile-top{text-align:center;padding:10px 0 17px}
.profile-avatar{width:78px;height:78px;border-radius:50%;object-fit:cover;background:#e6e6ec;margin:auto}
.empty{padding:24px 10px;text-align:center;color:#92919a;font-size:13px}
input,textarea{font:inherit;width:100%;border:1px solid #dedee5;border-radius:10px;padding:10px;margin:5px 0;background:white;color:#222}
textarea{min-height:90px}
a{color:var(--blue)}
</style>
</head>
<body>
<div class="phone">
  <div class="wallpaper" id="wallpaper"></div>
  <div class="status"><span id="statusTime">9:41</span><span>●●● Wi-Fi ▰</span></div>
  <div class="island"></div>

  <section class="screen active" id="lockScreen">
    <div class="lock">
      <div class="lock-date" id="lockDate"></div>
      <div class="lock-clock" id="lockClock">9:41</div>
      <div class="lock-message">Introduce tu código</div>
      <div class="dots"><i class="dot"></i><i class="dot"></i><i class="dot"></i><i class="dot"></i><i class="dot"></i><i class="dot"></i></div>
      <div class="keypad">
        <button class="key" onclick="window.pressKey('1')">1</button><button class="key" onclick="window.pressKey('2')">2</button><button class="key" onclick="window.pressKey('3')">3</button>
        <button class="key" onclick="window.pressKey('4')">4</button><button class="key" onclick="window.pressKey('5')">5</button><button class="key" onclick="window.pressKey('6')">6</button>
        <button class="key" onclick="window.pressKey('7')">7</button><button class="key" onclick="window.pressKey('8')">8</button><button class="key" onclick="window.pressKey('9')">9</button>
        <button class="key" style="grid-column:2" onclick="window.pressKey('0')">0</button>
      </div>
      <div class="lock-hint">Cualquier combinación de seis números desbloquea</div>
    </div>
  </section>

  <section class="screen" id="homeScreen">
    <div class="home">
      <div class="home-clock" id="homeClock">9:41</div>
      <div class="app-grid" id="appGrid"></div>
    </div>
    <div class="dock" id="dock"></div>
  </section>

  <section class="app-screen" id="appScreen">
    <div class="app-header"><button class="back" onclick="window.closeApp()">‹ Inicio</button><h2 id="appTitle"></h2><span></span></div>
    <div class="content" id="appContent"></div>
  </section>
  <div class="home-indicator"></div>
</div>

<script>
const CONFIG = {
  lockWallpaper: "fondos/bloqueo.jpeg",
  homeWallpaper: "fondos/fondo-iniciojjj.jpeg",
  // ...
}

  apps: [
    {id:"messages", name:"Mensajes", icon:"icons/ios17_messages.png"},
    {id:"photos", name:"Fotos", icon:"icons/ios18_photos.png"},
    {id:"notes", name:"Notas", icon:"icons/ios17_notes.png"},
    {id:"calendar", name:"Calendario", icon:"icons/ios17_calendar.png"},
    {id:"phone", name:"Teléfono", icon:"icons/ios17_phone.png"},
    {id:"mail", name:"Gmail", icon:"icons/ios18_gmail.png"},
    {id:"safari", name:"Safari", icon:"icons/ios17_safari.png"},
    {id:"music", name:"Música", icon:"icons/ios18_music.png"},
    {id:"instagram", name:"Instagram", icon:"icons/ios17_instagram.png"}
  ],
  dock: ["phone","safari","messages","music"],
  photos: [],
  notes: [],
  contacts: [],
  searches: [],
  calls: [],
  emails: [],
  events: [],
  playlists: [],
  instagram: {
    username:"tu_usuario",
    name:"Tu nombre",
    bio:"Tu biografía aquí ♡",
    avatar:"",
    posts:[]
  }
};

const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
let code = "";

function setBackgrounds(){
  const lock = CONFIG.lockWallpaper;
  const home = CONFIG.homeWallpaper;
  if(lock) $("lockScreen").style.backgroundImage = `url("${lock}")`;
  if(home) $("homeScreen").style.backgroundImage = `url("${home}")`;
  $("lockScreen").style.backgroundSize = $("homeScreen").style.backgroundSize = "cover";
  $("lockScreen").style.backgroundPosition = $("homeScreen").style.backgroundPosition = "center";
}

function clock(){
  const d=new Date(), t=d.toLocaleTimeString("en-US",{hour:"numeric",minute:"2-digit"});
  $("statusTime").textContent=t;$("homeClock").textContent=t;$("lockClock").textContent=t;
  $("lockDate").textContent=d.toLocaleDateString("es-ES",{weekday:"long",day:"numeric",month:"long"});
}
clock(); setInterval(clock,1000); setBackgrounds();

function appIcon(app){
  return `<div class="app" onclick="window.openApp('${app.id}')"><div class="app-icon"><img src="${esc(app.icon)}" alt=""></div>${esc(app.name)}</div>`;
}

function buildHome(){
  $("appGrid").innerHTML = CONFIG.apps.map(appIcon).join("");
  $("dock").innerHTML = CONFIG.dock.map(id=>{
    const a = CONFIG.apps.find(x=>x.id===id);
    return a ? `<div class="app-icon" onclick="window.openApp('${a.id}')"><img src="${esc(a.icon)}" alt="${esc(a.name)}"></div>` : "";
  }).join("");
}
buildHome();

// Funciones globales expuestas correctamente para el DOM
window.pressKey = function(n){
  if(code.length >= 6) return;
  code += n;
  document.querySelectorAll(".dot").forEach((d,i)=>d.classList.toggle("filled", i < code.length));
  
  if(code.length === 6){
    setTimeout(()=>{
      $("lockScreen").classList.remove("active");
      $("homeScreen").classList.add("active");
      code = "";
      document.querySelectorAll(".dot").forEach(d=>d.classList.remove("filled"));
    }, 250);
  }
};

window.openApp = function(id){
  const app = CONFIG.apps.find(a=>a.id===id);
  if(!app) return;
  $("homeScreen").classList.remove("active");
  $("appScreen").classList.add("open");
  $("appTitle").textContent = app.name;
  renderApp(id);
};

window.closeApp = function(){
  $("appScreen").classList.remove("open");
  $("homeScreen").classList.add("active");
};

function empty(msg){ return `<div class="empty">${esc(msg)}</div>`; }

function renderApp(id){
  const c = $("appContent");
  if(id==="photos"){
    c.innerHTML=`<div class="section-title">Biblioteca</div><p class="subtle">${CONFIG.photos.length} fotos</p><div class="photo-grid">${CONFIG.photos.map(p=>`<img src="${esc(p)}" alt="Foto">`).join("")}</div>${CONFIG.photos.length?"":empty("Tu galería está vacía.")}`;
  }
  if(id==="notes"){
    c.innerHTML=`<div class="section-title">Notas</div>${CONFIG.notes.map(n=>`<div class="note-card"><strong>${esc(n.title)}</strong>${esc(n.body)}</div>`).join("")}${CONFIG.notes.length?"":empty("Todavía no hay notas.")}`;
  }
  if(id==="messages"){
    c.innerHTML=`<div class="section-title">Mensajes</div>${CONFIG.contacts.map((p,i)=>`<div class="list-row row"><div class="avatar">${p.avatar?`<img src="${esc(p.avatar)}" style="width:100%;height:100%;object-fit:cover;border-radius:50%">`:esc((p.name||"?").slice(0,1).toUpperCase())}</div><div style="flex:1"><strong>${esc(p.name)}</strong><small>${esc(p.messages?.at(-1)?.text||"")}</small></div><button class="action" onclick="window.showChat(${i})">Chat</button></div>`).join("")}${CONFIG.contacts.length?"":empty("Tus contactos aparecerán aquí.")}`;
  }
  if(id==="safari"){
    c.innerHTML=`<div class="section-title">Safari</div><div class="card">⌕ Buscar en la web</div><h3>Historial</h3>${CONFIG.searches.map(s=>`<div class="list-row">◷ ${esc(s)}</div>`).join("")}${CONFIG.searches.length?"":empty("Historial vacío.")}`;
  }
  if(id==="phone"){
    c.innerHTML=`<div class="section-title">Recientes</div>${CONFIG.calls.map(x=>`<div class="list-row row"><div class="avatar">☎</div><div><strong>${esc(x.name)}</strong><small>${esc(x.type)} · ${esc(x.date)}</small></div></div>`).join("")}${CONFIG.calls.length?"":empty("No hay llamadas.")}<h3>Contactos</h3>${CONFIG.contacts.map(x=>`<div class="list-row">${esc(x.name)}</div>`).join("")}`;
  }
  if(id==="mail"){
    c.innerHTML=`<div class="section-title">Bandeja de entrada</div>${CONFIG.emails.map(e=>`<div class="list-row"><strong>${esc(e.from)}</strong><div>${esc(e.subject)}</div><small>${esc(e.date)}</small><p>${esc(e.body)}</p></div>`).join("")}${CONFIG.emails.length?"":empty("Bandeja vacía.")}`;
  }
  if(id==="calendar"){
    const ev=[...CONFIG.events].sort((a,b)=>a.date.localeCompare(b.date));
    c.innerHTML=`<div class="section-title">${new Date().toLocaleDateString("es-ES",{month:"long",year:"numeric"})}</div><div class="card">${ev.map(e=>`<div class="list-row"><strong>${esc(e.date)}</strong>${esc(e.title)}<div class="subtle">${esc(e.detail||"")}</div></div>`).join("")}</div>${ev.length?"":empty("No hay eventos.")}`;
  }
  if(id==="music"){
    c.innerHTML=`<div class="section-title">Biblioteca</div><h3>Playlists</h3>${CONFIG.playlists.map(p=>`<div class="list-row row"><div class="music-cover">${p.cover?`<img src="${esc(p.cover)}" style="width:100%;height:100%;object-fit:cover">`:"♫"}</div><div><strong>${esc(p.name)}</strong><small>${(p.songs||[]).length} canciones</small></div></div><div class="card">${(p.songs||[]).map(s=>`<div class="list-row">♫ ${esc(s)}</div>`).join("")}</div>`).join("")}${CONFIG.playlists.length?"":empty("Crea tus playlists.")}`;
  }
  if(id==="instagram"){
    const ig=CONFIG.instagram;
    c.innerHTML=`<div class="profile-top"><div class="profile-avatar">${ig.avatar?`<img src="${esc(ig.avatar)}" style="width:100%;height:100%;object-fit:cover;border-radius:50%">`:"♡"}</div><h3>${esc(ig.username)}</h3><strong>${esc(ig.name)}</strong><p>${esc(ig.bio)}</p><span class="pill">${ig.posts.length} publicaciones</span></div><div class="insta-grid">${ig.posts.map(p=>`<img src="${esc(p.image)}" alt="${esc(p.caption)}" title="${esc(p.caption)}">`).join("")}</div>${ig.posts.length?"":empty("Añade publicaciones.")}`;
  }
}

window.showChat = function(i){
  const p=CONFIG.contacts[i], c=$("appContent");
  c.innerHTML=`<button class="back" onclick="window.renderApp('messages')">‹ Mensajes</button><div class="section-title">${esc(p.name)}</div>${(p.messages||[]).map(m=>`<div class="bubble ${m.from==="me"?"me":""}">${esc(m.text)}</div>`).join("")}${(p.messages||[]).length?"":empty("Sin mensajes.")}`;
};
</script>
</body>
</html>
